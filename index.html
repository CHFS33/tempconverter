<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Temperature Converter</title>
  </head>
  <body>
    <main class="converter-section">
      <div class="converter-card">
        <h1 class="converter-heading">Temperature Converter</h1>
        <p class="converter-subheading">
          Enter a temperature in either unit to be converted.
        </p>
        <div class="converter-inputs-container">
          <div class="input-group">
            <label for="celsius" class="input-label">Celsius</label>
            <div class="input-container">
              <input
                type="number"
                class="converter-input"
                id="celsius"
                step="0.01"
                placeholder="0.00"
              />
              <span class="input-symbol">°C</span>
            </div>
          </div>
          <div class="input-group">
            <label for="fahrenheit" class="input-label">Fahrenheit</label>
            <div class="input-container">
              <input
                type="number"
                class="converter-input"
                id="fahrenheit"
                step="0.01"
                placeholder="0.00"
              />
              <span class="input-symbol">°F</span>
            </div>
          </div>
        </div>
        <p class="error-message" id="error-message"></p>
        <button class="convert-btn" id="convert-btn">
          Convert Temperature
        </button>
        <div class="results-container">
          <div class="result">
            <p class="result-label">Celsius</p>
            <p class="result-temperature" id="temperature-celsius">°C</p>
          </div>
          <div class="result-divider"></div>
          <div class="result">
            <p class="result-label">Fahrenheit</p>
            <p class="result-temperature" id="temperature-fahrenheit">°F</p>
          </div>
        </div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
